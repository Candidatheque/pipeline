# Les fonctions occupées par les candidats : mandats électifs et fonctions
# gouvernementales, datés et sourcés.
#
# Le seed tient la biographie entière, sans égard aux élections. C'est à la
# publication qu'une candidature ne reçoit que ce qui avait commencé avant son
# premier tour, et sans la date de fin d'une fonction encore en cours ce
# jour-là : elle appartient à l'avenir de l'élection.
#
# Conventions :
#   - une entrée par mandat tel que la source le découpe. Sycomore coupe les
#     mandats de député à chaque législature et à chaque entrée au
#     gouvernement ; on garde ce découpage, sans fusionner.
#   - le Sénat, lui, liste des élections : « Elu le … Réélu le … Fin de
#     mandat le … ». Chaque élection ouvre un mandat, qui court jusqu'à la date
#     « jusqu'au » quand la fiche en donne une, sinon jusqu'à l'élection
#     suivante ou à la fin de mandat. Les sénateurs de la IVe République
#     (Conseil de la République) sont notés `senateur` comme ceux de la Ve.
#   - les mandats de député européen viennent des données ouvertes du
#     Parlement européen, un par législature. Les sièges à l'Assemblée
#     commune de la CECA et à l'Assemblée parlementaire européenne, avant la
#     première élection directe de 1979, n'en sont pas : leurs membres étaient
#     désignés par les parlements nationaux.
#   - `fonction` : un code du vocabulaire fixe, défini dans
#                  `src/candidatheque/pipeline/seeds/fonctions.py`.
#   - `ressort`  : le territoire du mandat, tel que la source l'écrit — le
#                  département d'un député ou d'un sénateur, la commune d'un
#                  maire. Absent pour une fonction nationale.
#   - `intitule` : pour un membre du gouvernement seulement, le portefeuille
#                  tel que le décret de nomination le libelle.
#   - `debut`, `fin` : lus dans la source citée, jamais dans Wikidata quand
#                  une source officielle existe. Quand les deux divergent,
#                  la source fait foi. `fin` est absente d'une fonction encore
#                  en cours.
#   - `sources`  : au moins une. La fiche de l'assemblée pour un mandat
#                  parlementaire, le décret au Journal officiel pour une
#                  fonction gouvernementale. Wikidata n'est admis que pour un
#                  mandat local, faute de mieux.
#
# Les personnes sont listées par identifiant croissant, leurs fonctions par
# date de début.

