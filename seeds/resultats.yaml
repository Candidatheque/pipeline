# Les résultats de chaque tour, version après version.
#
# Deux décisions par élection, et c'est la seule forme sous laquelle ces
# chiffres existent : la déclaration des résultats du premier tour, puis la
# proclamation des résultats de l'élection. Le Conseil ne publie rien d'autre
# en données ouvertes, hors un tableau par département du seul premier tour de
# 2022.
#
# Ces chiffres ne sont pas ceux du ministère de l'Intérieur. Le Conseil annule
# des suffrages et rectifie des erreurs matérielles avant de proclamer ; les
# totaux qu'il donne sont nets de ces annulations, et ne se recoupent donc pas
# avec ceux d'un recensement administratif.
#
# Chaque tour empile ses versions dans l'ordre des étapes, une par étape, et la
# dernière fait foi :
#   - `resultats-provisoires` : le ministère de l'Intérieur, le soir du scrutin ;
#   - `resultats-definitifs`  : le ministère, après recensement des votes ;
#   - `proclamation`          : le Conseil constitutionnel, qui déclare les
#                               résultats du premier tour puis proclame ceux de
#                               l'élection ;
#   - `rectification`         : les tableaux annexés au Journal officiel, qui
#                               arrêtent les résultats jusqu'en 1995.
# L'ordre est celui du processus, pas celui des dates : les résultats
# définitifs du ministère peuvent paraître après la proclamation, qui fait
# pourtant foi.
#
# La rectification des tableaux annexés au Journal officiel est collectée pour
# 1981, 1988 et 1995 : `format: "tableau-jo"`, le texte de l'édition sous
# `raw/resultats/jo/`, et pour chaque tableau ses pages, ses colonnes et sa
# façon d'écrire les milliers. `libelles` rapproche de leur code les noms que
# le scan a trop abîmés ; `corrections` porte les cases que les contrôles du
# tableau ne suffisent pas à établir, lues à la main sur l'image, chacune avec
# ce que l'océrisation avait lu. L'édition de 1974 n'est pas accessible.
#
# Les résultats du ministère sont collectés de 2007 à 2022, avec leur détail
# par département : `format: "interieur"`, un `fichier` national et un fichier
# `departements`, tous deux recopiés en CSV sous `raw/resultats/interieur/`.
# Leur `date` est celle de la mise en ligne du jeu de données sur data.gouv.fr,
# la seule que la source porte : pour 2007 et 2012, versés en 2013, elle est
# bien postérieure au scrutin. Avant 2007, le ministère ne publie rien en
# données ouvertes.
#
# Pour la proclamation, `date` est celle de la décision, `fichier` renvoie à
# son texte commité sous `raw/resultats/` et `origine` à la décision dans le
# registre des sources.
#
# `candidats` rapproche le nom qu'écrit la source de la personne au registre.
# Comme pour les parrainages, le rapprochement est déclaré et jamais deviné :
# la transcription de 1965 écrit « Jean-Louis TIXIER-VIGNANCOU » sans son R
# final, celle de 1988 « Ariette LAGUILLER » pour Arlette. Un nom écrit noir sur
# blanc ici se relit et se corrige ; un seuil de ressemblance, non.
#
# L'ordre des candidats n'a pas d'importance ici : la publication suit celui
# de la décision, lu dans son texte.

