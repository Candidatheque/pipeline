# Registre des personnes.
#
# Sa seule raison d'être est d'attribuer les identifiants et de garantir leur
# unicité. Il n'est pas publié : le consommateur n'en a pas besoin pour
# regrouper les candidatures d'une même personne, l'identifiant y suffit.
#
# Conventions :
#   - `id`      : "PE-<4 chiffres>", attribué dans l'ordre de première
#                 apparition. Volontairement opaque : comme il ne dit rien,
#                 personne n'aura jamais de raison de le corriger. Un
#                 identifiant attribué n'est jamais réattribué à quelqu'un
#                 d'autre, même si la ligne disparaît.
#   - `nom_complet` : de qui il s'agit, pour la relecture humaine seulement.
#                 Même forme que dans une candidature, mais pas le même statut :
#                 le nom publié est celui porté lors du scrutin, qui appartient
#                 à la candidature. Ici, c'est l'orthographe de référence.
#
#                 Un seul champ, non découpé en nom et prénom. Le découpage est
#                 une inférence et non une donnée : « Jean Claude Matry » a deux
#                 prénoms, « Super Châtaigne » est un pseudonyme, « Fessard de
#                 Foucault » porte une particule au milieu. La structure, qui
#                 veut l'avoir la tire de Wikidata.
#   - `wikidata`: identifiant Wikidata de la personne. Lui est stable,
#                 contrairement au nom — et contrairement au libellé, qui manque
#                 en français pour cinq de ces éléments, dont ceux de Jacques
#                 Chirac et d'Emmanuel Macron. C'est bien le QID qu'on stocke,
#                 jamais le nom tel que Wikidata l'affiche.
#
# Ce registre a été constitué en une fois à partir des décisions du Conseil
# constitutionnel arrêtant les listes de candidats, de 1965 à 2022. Il se
# maintient à la main ensuite.

