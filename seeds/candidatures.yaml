# Candidatures aux élections présidentielles.
#
# Chaque candidature dit qui s'est présenté, et à quels tours. L'association
# entre une personne et un tour porte la ou les sources qui l'établissent.
#
# Ces candidatures sont toutes à l'état « validee » : elles viennent des
# décisions du Conseil constitutionnel arrêtant les listes officielles. Les
# états « declaree », « retiree » et « ecartee » serviront pour une élection à
# venir, où des candidatures non officielles circulent avant la liste arrêtée.
#
# Constitué en une fois à partir des vingt-deux décisions de 1965 à 2022, puis
# maintenu à la main.

