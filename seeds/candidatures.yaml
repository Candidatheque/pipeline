# Candidatures aux élections présidentielles.
#
# Chaque candidature dit qui s'est présenté, et à quels tours. L'association
# entre une personne et un tour porte la ou les sources qui l'établissent.
#
# Le nom n'est pas répété : il se déduit du registre des personnes. On ne le
# saisit que s'il diffère, c'est-à-dire si la personne a porté un autre nom lors
# de ce scrutin — un nom d'usage, un mariage. L'exception devient ainsi visible
# dans le seed, au lieu de se perdre parmi cent quatorze répétitions.
#
# `etats` est une trajectoire, pas un instantané : une suite datée et sourcée,
# dans l'ordre. L'état courant est le dernier élément, il n'est pas stocké à
# part. Une candidature déclarée puis abandonnée garde ainsi trace de sa
# déclaration, et une candidature validée garde qui l'avait annoncée.
#
# Ces candidatures n'ont qu'un seul état, « validee » : elles viennent des
# décisions du Conseil constitutionnel arrêtant les listes officielles, et rien
# n'a été collecté sur les déclarations qui les ont précédées. Les états
# « declaree », « retiree » et « ecartee » serviront pour une élection à venir.
#
# Constitué en une fois à partir des vingt-deux décisions de 1965 à 2022, puis
# maintenu à la main.

