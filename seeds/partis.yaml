# Registre des partis politiques.
#
# Comme celui des personnes, il attribue les identifiants et garantit leur
# unicité. Il n'est pas publié : rapprocher les candidatures d'un même parti ne
# demande que l'identifiant.
#
# Conventions :
#   - `id`       : "PA-<4 chiffres>", attribué dans l'ordre de première
#                  apparition, opaque et jamais réattribué une fois publié.
#   - `nom_complet` : orthographe de référence, pour la relecture. Le nom
#                  publié est celui porté lors du scrutin, qui appartient à la
#                  candidature : le Front national est devenu Rassemblement
#                  national en 2018, et une candidature de 2012 doit garder
#                  l'étiquette de 2012.
#   - `sigle`    : le nom court sous lequel le parti est couramment désigné —
#                  on dit « le PCF », rarement « le Parti communiste français ».
#                  Relevé dans la propriété P1813 de Wikidata, absent quand elle
#                  l'est. Quand plusieurs formes coexistent, la forme stylisée
#                  l'emporte : « PdF » plutôt que « PDF ».
#   - `wikidata` : identifiant de l'élément, quand il existe.

partis:
  # Relevés dans Wikidata, propriété P102 « membre d'un parti politique »,
  # pour les seules appartenances datées : une appartenance sans date ne dit
  # pas à quelle élection elle s'applique, et la retenir ferait de Charles
  # DE GAULLE un membre de l'UDR en 1965, trois ans avant sa fondation.
  #
  # Le nom est celui que Wikidata donne aujourd'hui à l'élément. Celui porté
  # lors d'un scrutin appartient à la candidature, et reste à trouver.
