# Registre des sources citées par les données publiées.
#
# Une source y est décrite une fois, et les données la citent par son
# identifiant. À la publication, la pipeline recopie la description complète à
# côté de chaque donnée qui s'y rattache : le seed est optimisé pour la
# maintenance, les fichiers publiés pour la lecture, et un consommateur n'a
# jamais à résoudre une référence.
#
# Conventions :
#   - `id`          : "<autorité>:<identifiant chez elle>". Pour le Conseil
#                     constitutionnel, le numéro de décision suivi de sa nature,
#                     qui est sa citation officielle. Le numéro seul ne suffit
#                     pas : 128 numéros sont portés par plusieurs décisions de
#                     natures différentes.
#   - `url`         : où lire le document.
#   - `commentaire` : de quoi il s'agit, en clair. Ici l'intitulé de la décision.
#   - `consultee_le`: date à laquelle la source a été consultée. Saisie, jamais
#                     calculée à la publication : une date d'horloge ferait
#                     bouger les fichiers à chaque passage.

