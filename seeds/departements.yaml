# Départements et collectivités, pour normaliser ce que les sources écrivent.
#
# Ce registre n'est pas publié : il sert à ramener à un code INSEE les formes
# que quarante ans de Journal officiel donnent au même département — « 59 »,
# « NORD », « Nord », et « HAUTS-DESEINE » quand l'impression a mangé le trait
# d'union. Le code publié est celui d'aujourd'hui.
#
# Conventions :
#   - `code` : le code INSEE courant, sur deux ou trois caractères. « 2A » et
#              « 2B » pour la Corse, qui n'a pas de numéro 20 depuis 1976.
#   - `nom`  : l'orthographe de référence, accents et traits d'union compris.
#   - `codes_anciens` : les numéros qu'une source antérieure à `jusqu_en`
#              emploie pour cette collectivité, et qui en désignent une autre
#              depuis. Ils se résolvent avec l'année du scrutin : sans cela, un
#              parrainage wallisien de 1995 serait publié à Saint-Barthélemy.
#   - `noms_anciens` : les noms que le département a portés avant d'être
#              renommé. Un nom abandonné n'a été repris par aucun autre, et se
#              résout donc sans l'année.
#
# La Corse d'avant 1976 n'a pas d'entrée. Elle formait un seul département,
# numéroté 20, que la partition a remplacé par 2A et 2B : lui donner l'un des
# deux serait choisir, et la commune seule le dirait. « Corse » en 1974 reste
# donc sans code.
#
# Trois codes rencontrés dans les sources ne figurent pas ici, faute de
# désigner un département : « 97A » et « 98 » pour les Français de l'étranger,
# « 99 » pour les représentants au Parlement européen, que le Journal officiel
# dit « de nationalité française et élus en France ». Le mandat les distingue
# déjà, et le champ reste absent.

# Formes qu'aucune règle ne sait résoudre, corrigées à la main. Elles sont rares
# — six présentations sur 60 723 — et toutes dues à l'océrisation des scans de
# 1981. Chacune porte le motif qui l'établit : c'est ce motif qui se relit en
# revue, pas le code.
#
# Le territoire lu à côté tranche ce que la forme seule laisse ambigu. « OS »
# vaut « 08 » ou « 05 » selon qu'on lit le S en 8 ou en 5 ; la commune nommée
# dans la même présentation le dit. Sans cette vérification, rien n'entre ici.
#
# Quatre formes restent volontairement absentes, faute d'être établissables :
#   - « 97 » et « OU » en 1981, sur des présentations sans territoire ;
#   - « Saint-Martin/Saint-Barthélemy » en 2017 et 2022, où c'est la source qui
#     ne tranche pas : les deux collectivités partagent une circonscription
#     législative et n'ont pas de code commun.

corrections:
  - brut: "OS"
    code: "08"
    motif: >-
      « Bernard DEDOUBLE, maire de DOUMELY-BEGNY » en 1981 : la commune est dans
      les Ardennes. Le O est un zéro et le S un 8.
  - brut: "II"
    code: "11"
    motif: >-
      « Pierre PLAS, maire de MERIAL » en 1981 : la commune est dans l'Aude. Les
      deux I sont des 1, comme ailleurs dans le même scan.

