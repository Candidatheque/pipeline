# Élections présidentielles françaises au suffrage universel direct.
#
# Ce fichier est saisi et maintenu à la main : c'est le point d'entrée de la
# pipeline, qui itère sur cette liste pour savoir quoi publier.
#
# Conventions :
#   - `id`    : "PR-<année>". Le préfixe `PR` réserve la place pour d'autres
#               types de scrutins (législatives, municipales) sans renommage
#               ultérieur. C'est aussi le nom du répertoire publié.
#   - `annee` : année du scrutin. Redondante avec l'identifiant : la pipeline
#               vérifie que les deux concordent, ce qui transforme une coquille
#               de saisie en erreur de validation.
#   - `wikidata`: identifiant de l'élément Wikidata. Se retrouve avec la requête
#               `requetes/elections-wikidata.rq`. Attention en la rejouant : la
#               classe interrogée contient aussi les scrutins d'avant 1962, au
#               suffrage indirect, qui sont hors périmètre.
#
# Volontairement minimal. Chaque champ ajouté ici devra être maintenu à la main
# sur les douze élections, de 1965 à 2027 ; tout ce qui peut être collecté le
# sera ailleurs.
#
# PR-2027 n'a pas encore eu lieu : l'entrée existe pour que les candidatures
# puissent s'y rattacher, mais aucune source ne publiera de résultats avant le
# scrutin.

elections:
  - id: "PR-1965"
    annee: 1965
    wikidata: "Q1450635"
