# D'où viennent les parrainages, et sous quelle forme.
#
# Le fichier source est commité dans `raw/`, jamais téléchargé : ces documents
# sont historiques et figés, et un fichier suivi par git est un meilleur
# archivage qu'une copie reconstruite à chaque passage.
#
# `format` dit à la pipeline comment le lire. Le code ne connaît que des
# formats, jamais des années : ajouter une élection, c'est ajouter une entrée
# ici, et n'écrire du code que si sa forme est inédite.
#
#   - `json-plat`       : un tableau, une entrée par parrainage. Forme de 2022.
#   - `json-par-candidat`: un tableau de candidats, chacun portant ses
#                         parrainages. Forme de 2017, aux champs accentués et
#                         aux dates en jj/mm/aaaa.
#   - `texte-jo`        : le texte du Journal officiel, en prose continue —
#                         « M. François DELECOLLE, maire de RUMIGNY (SOMME) ; ».
#                         Extrait du PDF une fois hors ligne par
#                         `outils/pdf_en_texte.py`, et commité dans `raw/` : la
#                         pipeline ne lit pas de PDF et n'océrise pas, la CI n'a
#                         donc besoin ni de poppler ni de tesseract.
#
# `etendue` dit si la source publie tout ou un échantillon. Avant la réforme de
# 2016, la loi n'imposait que 500 présentations par candidat, tirées au sort :
# 2007 et 2012 en comptent exactement 500 pour chacun. Les compter sans le
# savoir ferait croire que Nicolas Sarkozy n'a eu que 500 parrainages en 2007.
#
# `publications` associe chaque date de publication à la décision du Conseil
# qui l'a rendue publique. Un parrainage cite ainsi la décision exacte qui le
# concerne, et non une source générique pour toute l'élection.

