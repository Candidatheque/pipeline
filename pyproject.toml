[project]
name = "candidatheque-pipeline"
version = "0.1.0"
description = "Chaîne de traitement des données de la Candidathèque"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# La pipeline n'ouvre jamais de PDF ni de classeur Excel : elle lit le texte que
# `outils/` en a tiré une fois, et qui est commité dans `raw/`. Ces dépendances
# ne sont donc pas les siennes.
outils = [
    "pypdf>=6.0",
    "xlrd>=2.0",
]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
candidatheque = "candidatheque.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidatheque"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
